services:
  - type: web
    name: pulso-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: PULSO_COOKIE_SECURE
        value: "1"
      - key: PULSO_TRUST_PROXY
        value: "1"
      - key: PULSO_ALERTAS_EXTERNAS
        value: "0"
      - key: PULSO_ADMIN_EMAIL
        sync: false
      - key: PULSO_ADMIN_SENHA
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pulso-db
          property: connectionString

databases:
  - name: pulso-db
    plan: free
    databaseName: pulso
    user: pulso
