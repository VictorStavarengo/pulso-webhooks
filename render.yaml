services:
  - type: web
    name: pulso-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: PULSO_COOKIE_SECURE
        value: "1"
      - key: PULSO_TRUST_PROXY
        value: "1"
      - key: PULSO_ALERTAS_EXTERNAS
        value: "0"
      - key: PULSO_BACKUP
        value: "0"
      - key: PULSO_DEMO_SEED
        value: "1"
      - key: PULSO_LOJA_PADRAO
        value: Loja Aurora
      - key: PULSO_ADMIN_EMAIL
        sync: false
      - key: PULSO_ADMIN_SENHA
        sync: false
