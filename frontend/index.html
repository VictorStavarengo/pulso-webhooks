<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel de operações para monitorar pedidos e webhooks de e-commerce em tempo real." />
    <meta name="theme-color" content="#060606" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Pulso · Monitoramento de pedidos</title>
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem('pulso-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (error) {
          theme = 'dark';
        }
        var root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#060606' : '#f6f6f4');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
